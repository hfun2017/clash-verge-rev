name: Fork Build (NetHelper)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build NetHelper (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
          targets: x86_64-pc-windows-msvc

      - name: Add Rust Target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Pnpm install
        run: |
          pnpm i
          pnpm run prebuild x86_64-pc-windows-msvc

      # SKIP Tauri bundler entirely. After 7 failed attempts to make the
      # NSIS bundle step produce an installer (silent skip, missing
      # makensis, GitHub API rate-limited tool-fetch, etc.), the build
      # pipeline now uses --no-bundle and ships a portable single-file
      # .exe that the user can copy and double-click to run. No
      # installer, no Start-menu shortcut, no uninstaller — which is
      # actually a better fit for the corporate-network use case (less
      # visible than a "NetHelper Setup" entry in Programs and Features).
      # The raw exe lives at:
      #   src-tauri/target/x86_64-pc-windows-msvc/release/NetHelper.exe
      # and embeds both the WebView2 bootstrapper and the mihomo
      # sidecar (renamed to nethelper-windows-amd64-v2.exe).
      - name: Tauri build (no bundle)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          RUST_LOG: 'tauri_bundler=trace,tauri=trace,debug'
        shell: bash   # explicit bash, not pwsh — fixes 18 historical fails
        run: |
          set -e
          pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle --verbose > tauri-build.stdout 2> tauri-build.stderr || {
            echo "===== tauri-build.stdout (head 200) ====="
            head -200 tauri-build.stdout || echo "EMPTY"
            echo "===== tauri-build.stdout (tail 200) ====="
            tail -200 tauri-build.stdout || echo "EMPTY"
            echo "===== tauri-build.stderr (head 200) ====="
            head -200 tauri-build.stderr || echo "EMPTY"
            echo "===== tauri-build.stderr (tail 200) ====="
            tail -200 tauri-build.stderr || echo "EMPTY"
            echo "===== tauri-build.stderr line count ====="
            wc -l tauri-build.stdout tauri-build.stderr
            exit 1
          }
          echo "===== build OK ====="
          # tauri build runs from repo root, cargo target is at ./target (not ./src-tauri/target)
          ls -la target/x86_64-pc-windows-msvc/release/ 2>&1 | head -30 || echo "ROOT target dir missing"
          ls -la src-tauri/target/x86_64-pc-windows-msvc/release/ 2>&1 | head -30 || echo "src-tauri target dir missing"
          ls -la src-tauri/sidecar/ 2>&1 | head -10 || echo "no sidecar"

      - name: Upload artifacts (always upload logs for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetHelper-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/NetHelper.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/NetHelper.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/nethelper.exe
            target/x86_64-pc-windows-msvc/release/nethelper-mihomo*.exe
            tauri-build.stdout
            tauri-build.stderr
          if-no-files-found: error   # hard-fail if no .exe — never silently ship a "build that built nothing"

  release:
    name: Publish to GitHub Release (NetHelper)
    needs: build-windows
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: NetHelper-windows-x64
          path: release-assets/

      - name: List downloaded artifacts
        if: always()
        run: |
          ls -laR release-assets/ || true

      - name: Zip portable build (NetHelper.exe + sidecar)
        if: always()
        run: |
          cd release-assets
          # Files are at release-assets/target/x86_64-pc-windows-msvc/release/*.exe
          # and release-assets/tauri-build.{stdout,stderr}. zip -j doesn't recurse,
          # so we use find to collect all .exe + log files into a flat layout.
          find target -name '*.exe' -exec cp -v {} . \;
          cp -v tauri-build.stdout tauri-build.log 2>/dev/null || true
          cp -v tauri-build.stderr tauri-build.log 2>/dev/null || true
          ls -la
          echo "=== building zip ==="
          # Use 7z (zip on Ubuntu is sometimes missing the .exe extension support)
          7z a -tzip NetHelper-windows-x64.zip NetHelper.exe nethelper-mihomo*.exe tauri-build.log 2>&1
          ls -la NetHelper-windows-x64.zip
          echo "=== Zip contents (verify) ==="
          unzip -l NetHelper-windows-x64.zip 2>&1 || 7z l NetHelper-windows-x64.zip 2>&1

      - name: Create release with installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nethelper-build-${{ github.run_id }}
          name: 'NetHelper Windows x64 portable (build ${{ github.run_number }})'
          body: |
            NetHelper 是 [clash-verge-rev](https://github.com/clash-verge-rev/clash-verge-rev) 的改名 fork,专门用来绕过公司内网"按进程名封禁".

            ## 包含什么

            | 文件 | 说明 |
            |---|---|
            | `NetHelper.exe` | **GUI 主程序,双击运行** |
            | `nethelper-mihomo.exe` | 改名后的 Mihomo 稳定内核 (Tauri sidecar) |
            | `nethelper-mihomo-alpha.exe` | 改名后的 Mihomo 测试内核 (设置里可切换) |

            **重要**: 三个文件**必须放在同一目录**,不要拆开.

            ## 怎么用

            1. 下载下面的 `NetHelper-windows-x64.zip`
            2. 解压到任意目录 (建议 `D:\tools\nethelper\`,**不要放 `%ProgramFiles%`**,免安装)
            3. 双击 `NetHelper.exe`
            4. 首次运行会下载 WebView2 runtime (如果系统没有)
            5. 设置 → Profiles 导入你的订阅 / 配置文件
            6. 打开系统代理或 TUN 模式

            ## 关键信息

            - **GUI exe 名**: `NetHelper.exe`
            - **Mihomo 内核进程名**: `nethelper-mihomo.exe` / `nethelper-mihomo-alpha.exe`
            - **应用内部 ID**: `io.github.hfun2017.nethelper`
            - **配置目录**: `%APPDATA%\io.github.hfun2017.nethelper\`
            - **没有自动更新**,新版本自己来 Release 页拿
            - **没有安装包**,纯绿色版,删目录即卸载

            ## 改了什么

            - GUI: `clash-verge-rev` → `NetHelper` (产品名 / 窗口标题 / HTML title / app ID)
            - 内核: `verge-mihomo` → `nethelper-mihomo` (stable + alpha 两个版本都改)
            - IPC 管道: `verge-mihomo` → `nethelper`
            - 服务辅助进程: `clash-verge-service.exe` → `nethelper-service.exe`

            i18n 翻译文件里有几十处 "Clash Verge" 文案是**故意保留的** (app 内部 UI 文案,跟进程名/窗口名无关),详细见 [README](https://github.com/hfun2017/clash-verge-rev#readme).

            ## 仓库

            - **GUI fork**: https://github.com/hfun2017/clash-verge-rev
            - **Mihomo 内核 fork**: https://github.com/hfun2017/mihomo
          files: |
            release-assets/*.zip
            release-assets/*.log
          fail_on_unmatched_files: false
          draft: false
          prerelease: true
