name: Fork Build (NetHelper)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

permissions: write-all

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build NetHelper (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
          targets: x86_64-pc-windows-msvc

      - name: Add Rust Target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install NSIS
        # Tauri 2's bundled-NSIS auto-download fails silently on the
        # windows-latest runner when GitHub's API rate limit blocks the
        # tool-fetch. Install NSIS via choco so the bundle step is
        # guaranteed to find it and emit src-tauri/target/.../bundle/nsis/*.exe.
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          makensis /VERSION

      - name: Pnpm install
        run: |
          pnpm i
          pnpm run prebuild x86_64-pc-windows-msvc

      - name: Tauri build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetHelper-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish to GitHub Release (NetHelper)
    needs: build-windows
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: NetHelper-windows-x64
          path: release-assets/

      - name: Create release with installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nethelper-build-${{ github.run_id }}
          name: 'NetHelper Windows x64 (build ${{ github.run_number }})'
          body: |
            Custom build of NetHelper (renamed clash-verge-rev).

            **Process name (mihomo kernel)**: nethelper-windows-amd64-v2.exe
            **GUI**: NetHelper
            **Internal app ID**: io.github.hfun2017.nethelper
            **Mihomo fork**: https://github.com/hfun2017/mihomo
          files: release-assets/*.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
